[project]
name = "stems-mcp"
version = "0.1.0"
description = "Audio stem separation server using HTDemucs v4 via ONNX Runtime"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=3.4.4,<4",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "onnxruntime>=1.20.0",
    "httpx>=0.27.0",
    "numpy>=1.26.0",
    "soundfile>=0.12.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
gpu = ["onnxruntime-gpu>=1.20.0"]

[project.scripts]
stems-mcp = "stems_mcp.__main__:main"

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.backends._legacy:_Backend"
